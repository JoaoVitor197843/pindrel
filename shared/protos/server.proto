syntax = "proto3";

package sync;

option go_package = "backend/internal/api/dto";

message ServerInfo {
  string name = 1;
  bool registration_enabled = 2;
}

// Pindrel servers found on the local network (answer of GET /server/discover/, built by the gateway).
message DiscoveredServer {
  string name = 1;
  string host = 2;
  repeated string addresses = 3;
  int32 port = 4;
  // Random id the server generated once and keeps (empty: an older server). Lets a client notice that "Casa" is no
  // longer the same server it opened before.
  string id = 5;
  // Port of the server's HTTPS side (the `tls` entry of the mDNS record); 0 when it announces none. `port` stays the
  // plain HTTP port: a client that prefers HTTPS uses this one and falls back to `port`.
  int32 tls_port = 6;
}

message DiscoveredServers {
  repeated DiscoveredServer servers = 1;
}
