services:
  plany:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    ports:
      - "${PORT:-8080}:8080"
    env_file: ./backend/.env
    environment:
      - PORT=8080
      - DB_USER=${DB_USER:-dev}
      - DB_PASSWORD=${DB_PASSWORD:efine your DB_PASSWORD in .env}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-plany}
      - SSL_MODE=${SSL_MODE:-disable}
      - JWT_SECRET=${JWT_SECRET:-efine your JWT_SECRET in .env}
      - JWT_ACCESS_EXPIRY=${JWT_ACCESS_EXPIRY:-15m}
      - JWT_REFRESH_EXPIRY=${JWT_REFRESH_EXPIRY:-720h}
      - REGISTRATION_ENABLED=${REGISTRATION_ENABLED:-true}
      - DEBUG_MODE=${DEBUG_MODE:-false}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine

    restart: unless-stopped
    command: >
      postgres
        -c shared_buffers=32MB
        -c work_mem=4MB
        -c max_connections=20 
    environment:
      POSTGRES_DB: ${DB_NAME:-plany} 
      POSTGRES_USER: ${DB_USER:-dev} # if you want other username in your database change this 
      POSTGRES_PASSWORD: ${DB_PASSWORD:?define your DB_PASSWORD in .env}
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
volumes:
  pg_data: