services:
  plany:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    ports:
      - "${PORT:-8080}:8080"
    env_file: ./backend/.env
    environment:
      - PORT=${PORT:-8080}
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017}
      - MONGO_DB_NAME=${MONGO_DB_NAME:-plany}
      - JWT_SECRET=${JWT_SECRET:-change_me_to_a_long_random_string}
      - JWT_ACCESS_EXPIRY=${JWT_ACCESS_EXPIRY:-15m}
      - JWT_REFRESH_EXPIRY=${JWT_REFRESH_EXPIRY:-720h}
      - REGISTRATION_ENABLED=${REGISTRATION_ENABLED:-true}
    depends_on:
      mongo:
        condition: service_healthy

  mongo: # utilize somente caso não tenha um banco mongo exterior que queira
    image: mongo:8 # caso utilize dispositivos como o raspberry pi 4 ou inferiores coloque mongo:4.4.18
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    env_file: ./.env
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-change_me}
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo-data: