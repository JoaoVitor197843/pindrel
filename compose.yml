# RAM budget (see CLAUDE.md "Project priorities"): hard ceiling 512 MB, recommended 256 MB
# per instance, database included. The two limits below add up to the recommended 256 MB.
# The API is stateless: scale `plany` behind a load balancer; each replica keeps its own
# ceiling (the Postgres service is shared).
services:
  plany:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # port inside the container is fixed; ${PORT} above only picks the host port
      - PORT=8080
      - SERVER_NAME=${SERVER_NAME:-Plany}
      - DB_USER=${DB_USER:-dev}
      - DB_PASSWORD=${DB_PASSWORD:-change_me}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-plany}
      - SSL_MODE=${SSL_MODE:-disable}
      - JWT_SECRET=${JWT_SECRET:-change_me_to_a_long_random_string}
      - JWT_ACCESS_EXPIRY=${JWT_ACCESS_EXPIRY:-15m}
      - JWT_REFRESH_EXPIRY=${JWT_REFRESH_EXPIRY:-720h}
      - REGISTRATION_ENABLED=${REGISTRATION_ENABLED:-true}
      - DEBUG_MODE=${DEBUG_MODE:-false}
      - DB_MAX_CONNS=${DB_MAX_CONNS:-4}
      - IN_APP_RATE_LIMIT=${IN_APP_RATE_LIMIT:-true}
      # Go soft memory limit, kept below mem_limit so the GC works before the container is killed
      - GOMEMLIMIT=${GOMEMLIMIT:-100MiB}
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:18-alpine

    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    command: >
      postgres
        -c shared_buffers=32MB
        -c work_mem=4MB
        -c maintenance_work_mem=16MB
        -c max_connections=20
        -c max_worker_processes=4
        -c max_parallel_workers_per_gather=0
        -c autovacuum_max_workers=2
    environment:
      POSTGRES_DB: ${DB_NAME:-plany}
      POSTGRES_USER: ${DB_USER:-dev} # if you want other username in your database change this
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
    ports:
      # loopback only: needed to run the backend tests from the host, never exposed to the network
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  pg_data:
