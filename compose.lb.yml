# Overlay: several stateless API replicas behind the Plany gateway (load balancer, per-IP rate
# limit, mDNS announcement and discovery of other servers on the LAN).
#   docker compose -f compose.yml -f compose.lb.yml up -d --build --scale plany=2
# Extra RAM on top of the API replicas: the gateway, a few MB (16m cap).
services:
  plany:
    # loopback only, one port of the range per replica (up to 100 with --scale; widen both ranges for more)
    ports: !override
      - "127.0.0.1:9000-9099:8080"
    environment:
      # the gateway limits requests; replicas keep no such state
      - IN_APP_RATE_LIMIT=false
      - DB_MAX_CONNS=${DB_MAX_CONNS:-4}

  # mDNS needs the real LAN, so this one runs on the host network (it has no docker DNS there,
  # which is why the replicas publish on loopback ports). It listens on GATEWAY_PORT.
  gateway:
    build: ./gateway
    network_mode: host
    restart: unless-stopped
    mem_limit: 16m
    memswap_limit: 16m
    environment:
      - GATEWAY_PORT=${PORT:-8080}
      - SERVER_NAME=${SERVER_NAME:-Plany}
      - UPSTREAMS=127.0.0.1:9000-9099
    depends_on:
      - plany
