name: mobile
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_secure_storage: ^11.2.0
  flutter_riverpod: ^3.4.2
  sodium: ^4.0.3
  protobuf: ^6.1.0
  fixnum: ^1.1.1
  nsd: ^5.0.1
  multicast_dns: ^0.3.3+1
  http: ^1.6.0
  sqlite3: ^3.5.2
  path_provider: ^2.1.6
  path: ^1.9.1
dev_dependencies:
  flutter_test:
    sdk: flutter

  # smoke test that opens the real app on a real window/emulator (integration_test/); only used by the CI
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true
