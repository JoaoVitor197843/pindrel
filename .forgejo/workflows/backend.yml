# CI do backend (Go). Roda só quando o backend, o schema protobuf ou este arquivo mudam.
#
# - Um job só, no PC (runner `build`, imagem ci-pc): gofmt, go vet e TODOS os testes, os `TestDB_*` também, num
#   Postgres descartável (`services:`), com o schema aplicado pelo CLI golang-migrate (`migrate ... up`).
#   (Antes havia um job no Pi sem banco, ~5 min, que rodava um subconjunto do que este já roda.)
# - No PC os pacotes rodam em paralelo; o CI do Pi precisava de -p=1 e GOMEMLIMIT por causa da RAM.
#
name: backend

on:
  # chamado também pelo release.yml: a imagem só é publicada se este workflow passar
  workflow_call:
  push:
    # na main quem testa é o release.yml (chama este workflow); rodar de novo aqui seria trabalho em dobro
    branches-ignore: [main]
    paths:
      - "backend/**"
      - "shared/protos/**"
      - "gateway/tests/golden/**"
      - ".forgejo/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "shared/protos/**"
      - "gateway/tests/golden/**"
      - ".forgejo/workflows/backend.yml"

jobs:
  test:
    runs-on: build
    timeout-minutes: 30
    container:
      image: ci-pc:1
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: plany
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: plany
    defaults:
      run:
        working-directory: backend
    env:
      CGO_ENABLED: "0"
      PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: plany
      DB_PASSWORD: ci-only-password
      DB_NAME: plany
      SSL_MODE: disable
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 720h
    steps:
      - uses: actions/checkout@v4

      - name: Versão do Go compatível com o go.mod
        run: |
          want=$(awk '/^go /{print $2}' go.mod)
          have=$(go env GOVERSION | sed 's/^go//')
          echo "go.mod: $want | imagem: $have"
          # a imagem precisa ser >= ao go.mod (senão o Go baixaria outro toolchain)
          [ "$(printf '%s\n%s\n' "$want" "$have" | sort -V | head -n1)" = "$want" ]

      - name: Dependências
        run: go mod download

      - name: Análise — gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Arquivos sem gofmt:"; echo "$unformatted"; exit 1; fi

      - name: Análise — go vet
        run: go vet ./...

      - name: Esperar o Postgres
        shell: bash
        run: |
          for i in $(seq 1 60); do
            (echo > /dev/tcp/postgres/5432) 2>/dev/null && exit 0
            sleep 1
          done
          echo "o Postgres não respondeu em 60 s"; exit 1

      - name: Aplicar as migrations (golang-migrate, o mesmo que a API usa ao iniciar)
        run: migrate -path internal/database/migrations -database "postgres://plany:ci-only-password@postgres:5432/plany?sslmode=disable" up

      - name: Todos os testes, com banco
        run: go test ./... -count=1
