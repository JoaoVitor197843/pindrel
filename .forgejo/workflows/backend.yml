# CI do backend (Go). Roda só quando o backend, o schema protobuf ou este arquivo mudam.
#
# - Não roda os testes que precisam de Postgres/servidor (todos os `TestDB_*`): no runner não há banco
#   nem backend/.env. Rode-os localmente. O teste internal/testnaming garante que todo teste que usa o banco
#   tenha esse prefixo.
# - Limites de RAM para caber no Raspberry Pi (jobs rodam com capacity 1 e no máx. ~1,5 GB):
#   GOMEMLIMIT baixo, -p=1 (um pacote por vez) e CGO desligado (sem gcc, sem -race).
name: backend

on:
  # chamado também pelo release.yml: a imagem só é publicada se este workflow passar
  workflow_call:
  push:
    # na main quem testa é o release.yml (chama este workflow); rodar de novo aqui seria trabalho em dobro
    branches-ignore: [main]
    paths:
      - "backend/**"
      - "shared/protos/**"
      - "gateway/tests/golden/**"
      - ".forgejo/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "shared/protos/**"
      - "gateway/tests/golden/**"
      - ".forgejo/workflows/backend.yml"

jobs:
  analyze-and-test:
    runs-on: ci
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      CGO_ENABLED: "0"
      GOMEMLIMIT: 640MiB
      GOFLAGS: -p=1
    steps:
      - uses: actions/checkout@v4

      - name: Versão do Go compatível com o go.mod
        run: |
          want=$(awk '/^go /{print $2}' go.mod)
          have=$(go env GOVERSION | sed 's/^go//')
          echo "go.mod: $want | runner: $have"
          # o runner precisa ser >= ao go.mod (senão o Go baixaria outro toolchain)
          [ "$(printf '%s\n%s\n' "$want" "$have" | sort -V | head -n1)" = "$want" ]

      - name: Dependências
        run: go mod download

      - name: Análise — gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Arquivos sem gofmt:"; echo "$unformatted"; exit 1; fi

      - name: Análise — go vet
        run: go vet ./...

      - name: Testes (sem os que dependem de banco)
        run: go test ./... -skip '^TestDB_'

      - name: Pico de memória do job
        if: always()
        run: |
          echo "pico: $(( $(cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo 0) / 1048576 )) MiB"

  # TODOS os testes, os `TestDB_*` também: num Postgres descartável, no PC (o runner `ci` do Pi não tem banco).
  # O schema vem das migrations embutidas, aplicadas pelo mesmo código que a API usa ao iniciar.
  database-tests:
    runs-on: build
    timeout-minutes: 30
    container:
      image: ci-pc:1
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: plany
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: plany
    defaults:
      run:
        working-directory: backend
    env:
      CGO_ENABLED: "0"
      GOFLAGS: -p=1
      PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: plany
      DB_PASSWORD: ci-only-password
      DB_NAME: plany
      SSL_MODE: disable
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 720h
    steps:
      - uses: actions/checkout@v4

      - name: Esperar o Postgres
        shell: bash
        run: |
          for i in $(seq 1 60); do
            (echo > /dev/tcp/postgres/5432) 2>/dev/null && exit 0
            sleep 1
          done
          echo "o Postgres não respondeu em 60 s"; exit 1

      - name: Aplicar as migrations (o mesmo código da API)
        run: go run ./cmd/migrate

      - name: Todos os testes, com banco
        run: go test ./... -count=1
