# Backend CI (Go). Runs only when the backend, the protobuf schema or this file change.
#
# - A single job, on the PC (`build` runner, ci-pc image): gofmt, go vet and ALL tests, the `TestDB_*` ones too, on a
#   throwaway Postgres (`services:`), with the schema applied by the golang-migrate CLI (`migrate ... up`).
#   (There used to be a job on the Pi without a database, ~5 min, which ran a subset of what this one already runs.)
# - On the PC the packages run in parallel; the Pi's CI needed -p=1 and GOMEMLIMIT because of RAM.
#
name: backend

on:
  # also called by release.yml: the image is only published if this workflow passes
  workflow_call:
  push:
    # on main release.yml does the testing (it calls this workflow); running again here would be double work
    branches-ignore: [main]
    paths:
      - "backend/**"
      - "shared/protos/**"
      - "gateway/tests/golden/**"
      - ".forgejo/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "shared/protos/**"
      - "gateway/tests/golden/**"
      - ".forgejo/workflows/backend.yml"

jobs:
  test:
    runs-on: build
    timeout-minutes: 30
    container:
      image: ci-pc:1
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: pindrel
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: pindrel
    defaults:
      run:
        working-directory: backend
    env:
      CGO_ENABLED: "0"
      PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: pindrel
      DB_PASSWORD: ci-only-password
      DB_NAME: pindrel
      SSL_MODE: disable
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 720h
    steps:
      - uses: actions/checkout@v4

      - name: Versão do Go compatível com o go.mod
        run: |
          want=$(awk '/^go /{print $2}' go.mod)
          have=$(go env GOVERSION | sed 's/^go//')
          echo "go.mod: $want | imagem: $have"
          # the image must be >= go.mod's version (otherwise Go would download another toolchain)
          [ "$(printf '%s\n%s\n' "$want" "$have" | sort -V | head -n1)" = "$want" ]

      # The image already carries the modules (ci-pc-cache.Dockerfile); this only matters when go.mod gets ahead of it.
      # proxy.golang.org kept cutting HTTP/2 streams on this network ("stream error ... INTERNAL_ERROR"), so the
      # download uses HTTP/1.1 and tries up to 3 times.
      - name: Dependências
        env:
          GODEBUG: http2client=0
        run: |
          for i in 1 2 3; do
            go mod download && exit 0
            [ "$i" -lt 3 ] || exit 1
            sleep 10
          done

      - name: Análise — gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Arquivos sem gofmt:"; echo "$unformatted"; exit 1; fi

      - name: Análise — go vet
        run: go vet ./...

      - name: Esperar o Postgres
        shell: bash
        run: |
          for i in $(seq 1 60); do
            (echo > /dev/tcp/postgres/5432) 2>/dev/null && exit 0
            sleep 1
          done
          echo "o Postgres não respondeu em 60 s"; exit 1

      - name: Aplicar as migrations (golang-migrate, o mesmo que a API usa ao iniciar)
        run: migrate -path internal/database/migrations -database "postgres://pindrel:ci-only-password@postgres:5432/pindrel?sslmode=disable" up

      - name: Todos os testes, com banco
        run: go test ./... -count=1
