# Mobile CI (Flutter). Runs only when mobile, the protobuf schema or this file change.
#
# - Uses the `flutter` label (PC runner, ci-flutter:1 image there; the Pi, with 1 slot, took ~6 min). The Pi's
#   `ci-flutter` label (see .forgejo/images/ci-flutter.Dockerfile) still exists as an alternative.
# - Analysis: `flutter analyze` (Dart, flutter_lints).
# - Tests: does not run the integration test that calls the Go server ("Testa a chamada de api para o go");
#   empty test files (placeholders) are ignored until they get content, otherwise
#   flutter test fails to load them.
name: mobile

on:
  # also called by release.yml: the image is only published if this workflow passes
  workflow_call:
  push:
    # on main release.yml does the testing (it calls this workflow); running again here would be double work
    branches-ignore: [main]
    paths:
      - "mobile/**"
      - "shared/protos/**"
      - ".forgejo/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "shared/protos/**"
      - ".forgejo/workflows/mobile.yml"

jobs:
  analyze-and-test:
    runs-on: flutter
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    env:
      CI: "true"
      FLUTTER_SUPPRESS_ANALYTICS: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Flutter da imagem = versão pinada no .fvmrc
        run: |
          want=$(sed -n 's/.*"flutter": *"\([^"]*\)".*/\1/p' .fvmrc)
          have=$(flutter --version | awk 'NR==1{print $2}')
          echo ".fvmrc: $want | imagem: $have"
          [ "$want" = "$have" ]

      - name: Dependências
        run: flutter pub get

      - name: Análise — flutter analyze
        run: flutter analyze

      - name: Testes (sem os que dependem do servidor)
        run: |
          files=$(find test -name '*_test.dart' -size +0)
          if [ -z "$files" ]; then echo "nenhum teste com conteúdo"; exit 0; fi
          flutter test $files --name '^(?!Testa a chamada de api para o go)'

      - name: Pico de memória do job
        if: always()
        run: |
          echo "pico: $(( $(cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo 0) / 1048576 )) MiB"
