# Web CI (Svelte + Vite + Tailwind). Runs only when web, the protobuf schema or this file change.
#
# - Analysis: `yarn check` = svelte-check (Svelte + TypeScript) + tsc of the Vite config.
# - Tests: vitest on jsdom, with no network or server. Empty test files (placeholders) are
#   ignored until they get content, otherwise vitest fails with "No test suite found".
name: web

on:
  # also called by release.yml: the image is only published if this workflow passes
  workflow_call:
  push:
    # on main release.yml does the testing (it calls this workflow); running again here would be double work
    branches-ignore: [main]
    paths:
      - "web/**"
      - "shared/protos/**"
      - ".forgejo/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "shared/protos/**"
      - ".forgejo/workflows/web.yml"

jobs:
  analyze-and-test:
    # on the PC (`build` runner, ci-pc image): ~4x faster than on the Pi and without fighting for its single slot
    runs-on: build
    container:
      image: ci-pc:1
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Dependências (lockfile imutável)
        run: yarn install --immutable

      - name: Análise — svelte-check + tsc
        run: yarn check

      - name: Testes
        run: |
          files=$(find src -name '*.test.ts' -size +0)
          if [ -z "$files" ]; then echo "nenhum teste com conteúdo"; exit 0; fi
          yarn vitest run $files

      - name: Pico de memória do job
        if: always()
        run: |
          echo "pico: $(( $(cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo 0) / 1048576 )) MiB"
