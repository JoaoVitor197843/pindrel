# Release gate: on push to main, runs ALL the tests (backend with a database, web, gateway, mobile) on the PC's runner.
#
# The images are NOT built here any more: the build runs on GitHub (.github/workflows/release-images.yml, ghcr.io), which
# is faster than this PC's connection and reaches the Raspberry Pi without Tailscale. This repository is mirrored to
# GitHub, so a push to main starts that build there on its own. It does not wait for these tests: run them
# (they are what this workflow does, or locally) before pushing to main.
name: release

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "web/**"
      - "gateway/**"
      - "shared/protos/**"
      - "Dockerfile"
      - ".forgejo/workflows/*.yml"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test-backend:
    uses: ./.forgejo/workflows/backend.yml
  test-web:
    uses: ./.forgejo/workflows/web.yml
  test-gateway:
    uses: ./.forgejo/workflows/gateway.yml
  test-mobile:
    uses: ./.forgejo/workflows/mobile.yml
