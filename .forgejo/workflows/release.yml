# Release gate: on push to main, runs ALL the tests (backend with a database, web, gateway, mobile) on the PC's runner and,
# only if every one passes, asks GitHub to build and publish the images for that commit.
#
# The images are built on GitHub (.github/workflows/release-images.yml, Docker Hub): faster than this PC's connection and
# reachable by the Raspberry Pi without Tailscale. GitHub cannot reach this Forgejo, so the `images` job below calls GitHub
# (.forgejo/scripts/dispatch-images.sh): it waits for the push mirror to bring the commit over and starts the workflow on it.
# GitHub no longer reacts to a push by itself, so a red test means no image and the Pi stays on the version it runs.
# Needs the secret GH_RELEASE_TOKEN with "Actions: read and write" (besides the "Contents" permission it already has).
name: release

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "web/**"
      - "gateway/**"
      - "shared/protos/**"
      - "Dockerfile"
      - ".forgejo/workflows/*.yml"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test-backend:
    uses: ./.forgejo/workflows/backend.yml
  test-web:
    uses: ./.forgejo/workflows/web.yml
  test-gateway:
    uses: ./.forgejo/workflows/gateway.yml
  test-mobile:
    uses: ./.forgejo/workflows/mobile.yml

  # Starts the image build on GitHub for THIS commit, only after all the tests above passed (`needs`).
  images:
    needs: [test-backend, test-web, test-gateway, test-mobile]
    runs-on: build
    container:
      image: ci-pc:1
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Pedir o build das imagens ao GitHub
        env:
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        run: sh .forgejo/scripts/dispatch-images.sh "$GITHUB_SHA"
