# Gateway CI (Rust). Runs only when the gateway, the protobuf schema or this file change.
#
# - The mDNS tests need multicast; where it does not exist they warn and pass.
# - RAM limits to fit the Raspberry Pi (jobs run with capacity 1 and at most ~1.5 GB):
#   one compile job at a time and tests with the development profile (no LTO).
name: gateway

on:
  # also called by release.yml: the image is only published if this workflow passes
  workflow_call:
  push:
    # on main release.yml does the testing (it calls this workflow); running again here would be double work
    branches-ignore: [main]
    paths:
      - "gateway/**"
      - "shared/protos/**"
      - ".forgejo/workflows/gateway.yml"
  pull_request:
    paths:
      - "gateway/**"
      - "shared/protos/**"
      - ".forgejo/workflows/gateway.yml"

jobs:
  analyze-and-test:
    # no Rust on the `ci` runner (the Pi): runs on the PC, in the ci-pc image (.forgejo/images/ci-pc.Dockerfile)
    runs-on: build
    container:
      image: ci-pc:1
    timeout-minutes: 45
    defaults:
      run:
        working-directory: gateway
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          cargo --version
          rustc --version

      - name: Análise — rustfmt
        run: cargo fmt --check

      # the plain gateway, and with every optional feature (HTTPS, its own CA, the pairing): both ship
      - name: Análise — clippy
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --all-features -- -D warnings

      # cargo audit clones the whole history of the advisory database and that clone does not finish from the PC's
      # network (measured: a full clone did not end in 120 s, a shallow one takes seconds), which failed the job twice.
      # So it gets a shallow clone and does not fetch. Yanked crates stay covered: deny.toml has `yanked = "deny"`.
      - name: Segurança — dependências (cargo audit + cargo deny)
        run: |
          for i in 1 2 3; do
            rm -rf /tmp/advisory-db
            git clone -q --depth 1 https://github.com/RustSec/advisory-db.git /tmp/advisory-db && break
            [ "$i" -lt 3 ] || { echo "não consegui baixar o banco de advisories"; exit 1; }
            sleep 10
          done
          cargo audit --db /tmp/advisory-db --no-fetch --no-yanked --deny warnings
          for i in 1 2 3; do
            cargo deny check && break
            [ "$i" -lt 3 ] || exit 1
            sleep 10
          done

      - name: Testes (unitários, integração, binário e mDNS)
        run: |
          cargo test --locked
          cargo test --locked --all-features

      - name: Testes dos scripts de compilação cruzada (arm64)
        working-directory: gateway
        run: sh cross/test_zigcc.sh

      # what the image ships (the Dockerfile builds it with the `selfcert` feature)
      - name: Compila em release (perfil de produção)
        run: cargo build --release --locked --features selfcert

      - name: Tamanho e pico de memória do job
        if: always()
        run: |
          ls -l target/release/gateway 2>/dev/null | awk '{printf "binário: %.1f MB\n", $5/1048576}' || true
          echo "pico: $(( $(cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo 0) / 1048576 )) MiB"

  # Hostile input into the parsers (the file of remembered servers, the settings, who a request belongs to).
  # Needs nightly (libFuzzer); the corpus is rebuilt from fuzz/seeds on every run, so it is short on purpose.
  fuzz:
    runs-on: build
    container:
      image: ci-pc:1
    timeout-minutes: 15
    defaults:
      run:
        working-directory: gateway
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4

      - name: Fuzz (40 s por alvo)
        run: |
          cargo +nightly fuzz build --fuzz-dir fuzz
          for t in discovered_servers settings client_ip; do
            mkdir -p "fuzz/corpus/$t"
            cargo +nightly fuzz run --fuzz-dir fuzz "$t" "fuzz/corpus/$t" "fuzz/seeds/$t" -- -max_total_time=40 -rss_limit_mb=1024
          done
