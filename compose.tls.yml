# Overlay: HTTPS with the gateway's own certificate authority (no domain, no account, nothing to buy).
#   docker compose -f compose.yml -f compose.lb.yml -f compose.tls.yml up -d --build --scale pindrel=2
# On a host that runs the released images (the Raspberry Pi) the same file goes after compose.registry.yml: it only sets
# environment and memory, the gateway image already carries the TLS code (the Dockerfile builds it for amd64 and arm64).
# The gateway creates a CA and its server certificate on the first start (kept in the `gateway-data` volume: keep it, or
# every paired device has to pair again), serves HTTP/1.1 and HTTP/2 on TLS_PORT and turns the plain port into a
# page that explains how to connect securely (see CLAUDE.md, "TLS"). Open http://<this machine>:${PORT:-8080}/ to start.
services:
  gateway:
    # 1000 open WebSockets measured 28 MiB; compose.lb.yml now has the same 48m cap
    mem_limit: 48m
    memswap_limit: 48m
    environment:
      - TLS_PORT=${TLS_PORT:-8443}
      - TLS_AUTO=true
      - TLS_DIR=/data/tls
      # names or addresses to add to the certificate (a domain of your own, a second address); comma-separated
      - TLS_SANS=${TLS_SANS:-}
      # redirect: the plain port only serves the connection page; full: as without TLS
      - HTTP_MODE=${HTTP_MODE:-full}
      - PAIRING_MAX_ROOMS=${PAIRING_MAX_ROOMS:-6}
      # origins, besides the server's own, whose pages may open a WebSocket (comma-separated)
      - WS_ALLOWED_ORIGINS=${WS_ALLOWED_ORIGINS:-}
