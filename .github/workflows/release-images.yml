# Images: builds Pindrel's API (with the embedded web) and the gateway for amd64 and arm64 and publishes them to Docker Hub
# (joaovitor2753/pindrel and joaovitor2753/pindrel-gateway). The Raspberry Pi pulls them by itself (deploy/update.sh).
#
# - GitHub reads only .github/workflows (the Forgejo reads .forgejo/workflows); this repository is a push mirror of the
#   Forgejo. The Forgejo runs the tests and, only when they all pass, starts THIS workflow through the API
#   (.forgejo/scripts/dispatch-images.sh) with the commit to build, so a push alone never publishes anything. It can also be
#   run by hand here (Actions > release-images > Run workflow) with a full commit sha.
# - No emulation: the Dockerfiles cross-compile (Go and Rust in the build machine's stage; the final stage has no RUN).
# - Needs ONE repository secret (Settings > Secrets and variables > Actions): DOCKERHUB_TOKEN, a Docker Hub access token
#   with Read & Write (Account settings > Personal access tokens). Without it the run stops at once with a clear message.
# - A `v*` tag (pushed by hand, see CLAUDE.md) does not build anything: it adds the version tags to the images of ITS commit,
#   which must already exist (run this workflow on main first).
name: release-images

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Full sha (40 characters) of the commit to build; it must already be on this repository"
        required: true
        type: string
  push:
    tags: ["v*"]

# two publications at the same time would fight over the `latest` tag
concurrency:
  group: release-images
  cancel-in-progress: false

env:
  HUB: joaovitor2753
  SOURCE: https://github.com/JoaoVitor197843/pindrel

permissions:
  contents: read

jobs:
  images:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Conferir o sha
        env:
          SHA: ${{ inputs.sha }}
        run: |
          case "$SHA" in *[!0-9a-f]* | "") echo "sha inválido"; exit 1;; esac
          [ "${#SHA}" -eq 40 ] || { echo "o sha precisa ter 40 caracteres"; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          [ -n "$DOCKERHUB_TOKEN" ] || { echo "falta o secret DOCKERHUB_TOKEN (Settings > Secrets and variables > Actions)"; exit 1; }
          echo "$DOCKERHUB_TOKEN" | docker login -u "$HUB" --password-stdin

      - name: API + web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.HUB }}/pindrel:${{ inputs.sha }}
            ${{ env.HUB }}/pindrel:latest
          labels: |
            org.opencontainers.image.source=${{ env.SOURCE }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha,scope=pindrel
          cache-to: type=gha,scope=pindrel,mode=max

      - name: Gateway
        uses: docker/build-push-action@v6
        with:
          context: gateway
          file: gateway/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.HUB }}/pindrel-gateway:${{ inputs.sha }}
            ${{ env.HUB }}/pindrel-gateway:latest
          labels: |
            org.opencontainers.image.source=${{ env.SOURCE }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,scope=gateway,mode=max

      - name: Conferir as duas arquiteturas
        run: |
          for name in pindrel pindrel-gateway; do
            docker buildx imagetools inspect "$HUB/$name:latest" | tee /tmp/inspect.txt
            grep -q 'linux/amd64' /tmp/inspect.txt && grep -q 'linux/arm64' /tmp/inspect.txt
          done

  version-tags:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Tags de versão nas imagens do commit
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          [ -n "$DOCKERHUB_TOKEN" ] || { echo "falta o secret DOCKERHUB_TOKEN"; exit 1; }
          echo "$DOCKERHUB_TOKEN" | docker login -u "$HUB" --password-stdin
          version=${GITHUB_REF_NAME#v}
          # 1.2.3 -> also 1.2; a pre-release (1.2.3-rc1) only gets its own tag
          extra=""
          case $version in *-*) ;; *) extra="${version%.*}" ;; esac
          for name in pindrel pindrel-gateway; do
            docker buildx imagetools inspect "$HUB/$name:$GITHUB_SHA" >/dev/null 2>&1 \
              || { echo "não há imagem $name:$GITHUB_SHA: rode o release-images na main antes de marcar a versão"; exit 1; }
            tags="-t $HUB/$name:$version"
            [ -z "$extra" ] || tags="$tags -t $HUB/$name:$extra"
            docker buildx imagetools create $tags "$HUB/$name:$GITHUB_SHA"
          done
