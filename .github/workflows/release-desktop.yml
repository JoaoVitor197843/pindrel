# Windows and macOS builds of the app, the Windows builds of the gateway and of the server (zip and installer each), plus a compile check of the iOS app. Flutter cannot cross-compile them from the
# Linux runner of the Forgejo, so GitHub Actions does it. This folder is on purpose: Forgejo reads .forgejo/workflows and
# ignores .github, and GitHub reads only this one.
#
# - Push to main that touches the app: builds only, to catch a break before a release.
# - Tag `v*` (the Forgejo push mirror sends it): builds, and attaches the zips (and the Windows installer) to a GitHub release. The Forgejo
#   release-tag.yml waits for them there and copies them into its own release (.forgejo/scripts/github-assets.sh).
# - No signing: Windows shows SmartScreen on the first run, macOS needs "Open" from the context menu, and the iOS job
#   only compiles (--no-codesign): nothing it makes can be installed.
name: release-desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
    # GitHub does not apply path filters to tags
    paths: ["mobile/**", "gateway/**", "backend/**", "web/**", "shared/protos/**", ".github/workflows/release-desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_SUPPRESS_ANALYTICS: "true"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      # same pinned version as mobile/.fvmrc and the Forgejo image
      - name: Versão do Flutter
        id: flutter
        run: |
          echo "version=$(sed -n 's/.*"flutter": *"\([^"]*\)".*/\1/p' .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      - name: Compilar (Windows)
        run: |
          flutter pub get
          # the Windows version resource takes digits only: v1.2.0-rc1 becomes 1.2.0
          ver=${GITHUB_REF_NAME#v}; ver=${ver%%-*}
          case "$GITHUB_REF" in refs/tags/v*) ;; *) ver=0.0.0 ;; esac
          flutter build windows --release --build-name="$ver" --build-number="$GITHUB_RUN_NUMBER"

      # two downloads of the same build: a zip to unpack anywhere (portable) and an installer that also brings the
      # uninstaller (Inno Setup, mobile/windows/installer/pindrel.iss). The runner has Inno Setup; if an image ever drops it,
      # it is fetched from Chocolatey.
      - name: Empacotar
        shell: pwsh
        working-directory: .
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME } else { 'ci' }
          # the version of the installer takes digits only: v1.2.0-rc1 becomes 1.2.0
          $ver = if ($tag -eq 'ci') { '0.0.0' } else { ($tag -replace '^v', '') -replace '-.*$', '' }
          New-Item -ItemType Directory -Force dist | Out-Null
          $release = (Resolve-Path 'mobile/build/windows/x64/runner/Release').Path
          Compress-Archive -Path "$release/*" -DestinationPath "dist/pindrel-app_${tag}_windows_amd64_portable.zip"

          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          $path = if ($iscc) { $iscc.Source } else { 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' }
          if (-not (Test-Path $path)) {
            choco install innosetup -y --no-progress
            $path = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          }
          & $path "/DAppVersion=$ver" "/DSourceDir=$release" "/O$((Resolve-Path dist).Path)" "/Fpindrel-app_${tag}_windows_amd64_installer" mobile/windows/installer/pindrel.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

  # The gateway for Windows, built with its own HTTPS (the `selfcert` feature: MSVC is the C compiler `ring` needs). Same two
  # downloads as the app: a portable zip and an installer with its uninstaller (gateway/installer/windows).
  gateway-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4

      - name: Compilar (Windows)
        run: cargo build --release --locked --features selfcert,tray

      - name: Empacotar
        shell: pwsh
        working-directory: .
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME } else { 'ci' }
          $ver = if ($tag -eq 'ci') { '0.0.0' } else { ($tag -replace '^v', '') -replace '-.*$', '' }
          New-Item -ItemType Directory -Force dist | Out-Null
          $release = (Resolve-Path 'gateway/target/release').Path
          $stage = Join-Path $env:RUNNER_TEMP 'gateway-portable'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "$release/gateway.exe" $stage
          Copy-Item gateway/installer/windows/gateway.env.example $stage
          Copy-Item gateway/installer/windows/portable/* $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/pindrel-gateway_${tag}_windows_amd64_portable.zip"

          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          $path = if ($iscc) { $iscc.Source } else { 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' }
          if (-not (Test-Path $path)) {
            choco install innosetup -y --no-progress
            $path = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          }
          & $path "/DAppVersion=$ver" "/DSourceDir=$release" "/O$((Resolve-Path dist).Path)" "/Fpindrel-gateway_${tag}_windows_amd64_installer" gateway/installer/windows/pindrel-gateway.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: gateway-windows
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

  # The server for Windows: the Go API, the web build it serves and its own PostgreSQL. Same two downloads as the gateway:
  # a portable zip and an installer with its uninstaller (backend/installer/windows). The portable folder is started for
  # real on this runner (database created, a sign-up through the API, stopped) before anything is packed.
  server-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    # new: until it has gone through a real release, a failure here must not keep the app and the gateway from being
    # published (the release job needs it, and then simply has no server files)
    continue-on-error: true
    env:
      # PostgreSQL for Windows from EnterpriseDB, the zip without an installer. Pinned with its checksum: a new version is a
      # change to these two lines. A new MAJOR version needs pg_upgrade for the databases already created (the start script
      # refuses to open a database of another major version and says so).
      PG_ZIP: postgresql-18.7-2-windows-x64-binaries.zip
      PG_ZIP_SHA256: 74f3740a2e7844118857f297c2067d226f8f2b0652de96022ce54bb27cd60a79
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Página web
        shell: bash
        working-directory: web
        run: |
          # the same Yarn as the ci-pc image (.forgejo/images/ci-pc.Dockerfile)
          corepack enable
          corepack prepare yarn@4.18.1 --activate
          yarn install --immutable
          yarn build

      - name: Servidor (Windows)
        shell: bash
        working-directory: backend
        env:
          CGO_ENABLED: "0"
        run: |
          # the tests that need no database, on Windows itself (the installer files, the settings reader, the static files)
          go test ./installer/... ./internal/config/ ./internal/api/... ./internal/files/ -skip '^TestDB_'
          go build -trimpath -ldflags="-s -w" -o ../stage/pindrel-server.exe ./cmd/api

      - name: PostgreSQL e montagem da pasta
        shell: pwsh
        run: |
          Invoke-WebRequest "https://get.enterprisedb.com/postgresql/$env:PG_ZIP" -OutFile pg.zip
          $sum = (Get-FileHash pg.zip -Algorithm SHA256).Hash.ToLower()
          if ($sum -ne $env:PG_ZIP_SHA256) { throw "checksum of $env:PG_ZIP is $sum, expected $env:PG_ZIP_SHA256" }
          Expand-Archive pg.zip -DestinationPath pgzip
          $pg = 'stage/pgsql'
          New-Item -ItemType Directory -Force $pg | Out-Null
          foreach ($d in 'bin', 'lib', 'share') { Copy-Item "pgzip/pgsql/$d" "$pg/$d" -Recurse }
          Copy-Item pgzip/pgsql/server_license.txt $pg/
          # what a server never uses: pgAdmin and StackBuilder (left in the zip), StackBuilder's GUI libraries, static
          # libraries, headers for extensions, and the translated messages (the database runs with the C locale)
          Remove-Item "$pg/bin/stackbuilder.exe", "$pg/bin/wx*.dll", "$pg/lib/*.lib" -ErrorAction SilentlyContinue
          Remove-Item "$pg/lib/pgxs", "$pg/share/locale" -Recurse -ErrorAction SilentlyContinue
          # the zip expects the Visual C++ runtime to be installed; a copy next to the programs covers machines without it
          foreach ($dll in 'vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll') {
            if (-not (Test-Path "$pg/bin/$dll")) {
              if (Test-Path "$env:WINDIR/System32/$dll") { Copy-Item "$env:WINDIR/System32/$dll" "$pg/bin/" }
              else { Write-Warning "$dll not found on the runner" }
            }
          }
          Copy-Item web/dist stage/public -Recurse
          Copy-Item backend/installer/windows/pindrel-server.ps1, backend/installer/windows/server.env.example stage/
          "{0:N1} MiB" -f ((Get-ChildItem stage -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)

      - name: Testar a pasta portátil (banco, servidor, cadastro)
        shell: pwsh
        run: |
          # a space and an accent in the path on purpose: user folders have both
          $data = Join-Path $env:RUNNER_TEMP 'dados do João'
          $script = (Resolve-Path stage/pindrel-server.ps1).Path
          function Run([string]$Action) {
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -Action $Action -Data $data -Quiet
            if ($LASTEXITCODE -ne 0) {
              Get-ChildItem $data -Filter *.log | ForEach-Object { "--- $($_.Name)"; Get-Content $_.FullName -Tail 30 }
              throw "$Action failed: $LASTEXITCODE"
            }
          }
          try {
            Run init
            Run start
            $port = (Select-String -Path "$data/server.env" -Pattern '^PORT=(\d+)').Matches[0].Groups[1].Value
            $base = "http://127.0.0.1:$port"
            $info = Invoke-WebRequest "$base/server/info/" -UseBasicParsing
            if ($info.StatusCode -ne 200 -or $info.Headers['Content-Type'] -ne 'application/x-protobuf') { throw "server/info: $($info.StatusCode)" }
            $page = Invoke-WebRequest "$base/" -UseBasicParsing
            if ($page.Content -notmatch '<html') { throw 'the web page is not served' }
            # a sign-up writes to the database (migrations applied, citext loaded): RegisterInput {1: email, 2: username, 3: password}
            function Field([int]$n, [string]$v) { $b = [Text.Encoding]::UTF8.GetBytes($v); [byte[]](@((($n -shl 3) -bor 2), $b.Length) + $b) }
            $body = [byte[]]((Field 1 'ci@windows.test') + (Field 2 'Windows') + (Field 3 'uma-senha-longa-9'))
            $r = Invoke-WebRequest "$base/auth/register/" -Method Post -Body $body -ContentType 'application/x-protobuf' -UseBasicParsing
            if ($r.StatusCode -ne 201) { throw "register: $($r.StatusCode)" }
            "server, database and web answered on $base"
          } finally {
            Run stop
          }
          Start-Sleep -Seconds 2
          $stage = (Resolve-Path stage).Path
          $left = Get-Process postgres, pindrel-server -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$stage*" }
          if ($left) { throw "still running after stop: $($left.Path -join ', ')" }

      - name: Empacotar
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME } else { 'ci' }
          $ver = if ($tag -eq 'ci') { '0.0.0' } else { ($tag -replace '^v', '') -replace '-.*$', '' }
          New-Item -ItemType Directory -Force dist | Out-Null
          $stage = (Resolve-Path stage).Path
          $portable = Join-Path $env:RUNNER_TEMP 'server-portable'
          Copy-Item $stage $portable -Recurse
          Copy-Item backend/installer/windows/portable/* $portable
          Compress-Archive -Path "$portable/*" -DestinationPath "dist/pindrel-server_${tag}_windows_amd64_portable.zip"

          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          $path = if ($iscc) { $iscc.Source } else { 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' }
          if (-not (Test-Path $path)) {
            choco install innosetup -y --no-progress
            $path = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          }
          & $path "/DAppVersion=$ver" "/DSourceDir=$stage" "/O$((Resolve-Path dist).Path)" "/Fpindrel-server_${tag}_windows_amd64_installer" backend/installer/windows/pindrel-server.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: server-windows
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Versão do Flutter
        id: flutter
        run: |
          echo "version=$(sed -n 's/.*"flutter": *"\([^"]*\)".*/\1/p' .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      - name: Compilar (macOS)
        run: |
          flutter pub get
          ver=${GITHUB_REF_NAME#v}; ver=${ver%%-*}
          case "$GITHUB_REF" in refs/tags/v*) ;; *) ver=0.0.0 ;; esac
          flutter build macos --release --build-name="$ver" --build-number="$GITHUB_RUN_NUMBER"

      # the file name promises both architectures: fail loudly if the build is not universal
      - name: Conferir as arquiteturas
        run: |
          archs=$(lipo -archs build/macos/Build/Products/Release/Pindrel.app/Contents/MacOS/Pindrel)
          echo "arquiteturas: $archs"
          case "$archs" in "x86_64 arm64"|"arm64 x86_64") ;; *) echo "o app não é universal"; exit 1 ;; esac

      - name: Empacotar
        working-directory: .
        run: |
          case "$GITHUB_REF" in refs/tags/v*) tag=$GITHUB_REF_NAME ;; *) tag=ci ;; esac
          mkdir -p dist
          ditto -c -k --keepParent mobile/build/macos/Build/Products/Release/Pindrel.app "dist/pindrel-app_${tag}_macos_universal.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.zip
          if-no-files-found: error

  # Only proves the iOS app compiles; without an Apple developer account nothing can be installed from it.
  ios-check:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Versão do Flutter
        id: flutter
        run: |
          echo "version=$(sed -n 's/.*"flutter": *"\([^"]*\)".*/\1/p' .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      - name: Compilar (iOS, sem assinatura)
        run: |
          flutter pub get
          flutter build ios --release --no-codesign

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, gateway-windows, server-windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publicar na release do GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          notes="Builds de Windows (app, gateway e servidor, em zip portátil e instalador) e macOS da versão $TAG (sem assinatura). As demais plataformas e os binários do gateway estão na release principal do Forgejo."
          # every download has its checksum next to it, like the ones the Forgejo makes
          (cd dist && for f in *.zip *.exe; do [ -f "$f" ] || continue; sha256sum "$f" > "$f.sha256"; done)
          # a re-run replaces the files instead of failing on the existing release
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "$notes" $pre
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
