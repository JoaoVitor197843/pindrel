# Windows and macOS builds of the app, plus a compile check of the iOS app. Flutter cannot cross-compile them from the
# Linux runner of the Forgejo, so GitHub Actions does it. This folder is on purpose: Forgejo reads .forgejo/workflows and
# ignores .github, and GitHub reads only this one.
#
# - Push to main that touches the app: builds only, to catch a break before a release.
# - Tag `v*` (the Forgejo push mirror sends it): builds, and attaches the zips to a GitHub release. The Forgejo
#   release-tag.yml waits for them there and copies them into its own release (.forgejo/scripts/github-assets.sh).
# - No signing: Windows shows SmartScreen on the first run, macOS needs "Open" from the context menu, and the iOS job
#   only compiles (--no-codesign): nothing it makes can be installed.
name: release-desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
    # GitHub does not apply path filters to tags
    paths: ["mobile/**", "shared/protos/**", ".github/workflows/release-desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_SUPPRESS_ANALYTICS: "true"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      # same pinned version as mobile/.fvmrc and the Forgejo image
      - name: Versão do Flutter
        id: flutter
        run: |
          echo "version=$(sed -n 's/.*"flutter": *"\([^"]*\)".*/\1/p' .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      - name: Compilar (Windows)
        run: |
          flutter pub get
          # the Windows version resource takes digits only: v1.2.0-rc1 becomes 1.2.0
          ver=${GITHUB_REF_NAME#v}; ver=${ver%%-*}
          case "$GITHUB_REF" in refs/tags/v*) ;; *) ver=0.0.0 ;; esac
          flutter build windows --release --build-name="$ver" --build-number="$GITHUB_RUN_NUMBER"

      - name: Empacotar
        shell: pwsh
        working-directory: .
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME } else { 'ci' }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path 'mobile/build/windows/x64/runner/Release/*' -DestinationPath "dist/plany-app_${tag}_windows_amd64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Versão do Flutter
        id: flutter
        run: |
          echo "version=$(sed -n 's/.*"flutter": *"\([^"]*\)".*/\1/p' .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      - name: Compilar (macOS)
        run: |
          flutter pub get
          ver=${GITHUB_REF_NAME#v}; ver=${ver%%-*}
          case "$GITHUB_REF" in refs/tags/v*) ;; *) ver=0.0.0 ;; esac
          flutter build macos --release --build-name="$ver" --build-number="$GITHUB_RUN_NUMBER"

      # the file name promises both architectures: fail loudly if the build is not universal
      - name: Conferir as arquiteturas
        run: |
          archs=$(lipo -archs build/macos/Build/Products/Release/Plany.app/Contents/MacOS/Plany)
          echo "arquiteturas: $archs"
          case "$archs" in "x86_64 arm64"|"arm64 x86_64") ;; *) echo "o app não é universal"; exit 1 ;; esac

      - name: Empacotar
        working-directory: .
        run: |
          case "$GITHUB_REF" in refs/tags/v*) tag=$GITHUB_REF_NAME ;; *) tag=ci ;; esac
          mkdir -p dist
          ditto -c -k --keepParent mobile/build/macos/Build/Products/Release/Plany.app "dist/plany-app_${tag}_macos_universal.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.zip
          if-no-files-found: error

  # Only proves the iOS app compiles; without an Apple developer account nothing can be installed from it.
  ios-check:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Versão do Flutter
        id: flutter
        run: |
          echo "version=$(sed -n 's/.*"flutter": *"\([^"]*\)".*/\1/p' .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      - name: Compilar (iOS, sem assinatura)
        run: |
          flutter pub get
          flutter build ios --release --no-codesign

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publicar na release do GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          notes="Builds de Windows e macOS da versão $TAG (sem assinatura). As demais plataformas e os binários do gateway estão na release principal do Forgejo."
          # every download has its checksum next to it, like the ones the Forgejo makes
          (cd dist && for f in *.zip; do sha256sum "$f" > "$f.sha256"; done)
          # a re-run replaces the files instead of failing on the existing release
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "$notes" $pre
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
