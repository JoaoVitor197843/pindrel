# cargo deny check: licenses, advisories, sources and bans. The project is AGPL-3.0, so permissive licenses only.
[graph]
# the optional features (HTTPS and its own certificate authority) ship in the Docker image, so their dependencies are
# checked too
all-features = true
# what is built for: the three native targets and the musl ones of the Docker image / Raspberry Pi
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# ISC (ring, rustls-webpki, untrusted: the TLS stack) is as permissive as MIT and compatible with the AGPL
allow = ["AGPL-3.0-only", "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]

[bans]
# two versions of syn come from the proc-macro crates (tokio-macros, prost-derive), build time only
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
