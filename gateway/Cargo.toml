[package]
name = "pindrel-gateway"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Front-facing process of a Pindrel deployment: load balancer, rate limiter and mDNS announcer/discovery"

[lib]
name = "pindrel_gateway"
path = "src/lib.rs"

[[bin]]
name = "gateway"
path = "src/main.rs"

# Few, small dependencies on purpose: the whole process must stay in a few MB of RAM.
[dependencies]
bytes = "1"
gethostname = "1"
# rate limiting math (GCRA) and clock; the table of clients is ours (src/limiter.rs), with a hard cap
governor = { version = "0.10", default-features = false, features = ["std"] }
http-body-util = "0.1"
if-addrs = "0.15"
# the client address behind a trusted proxy: header parsers (X-Forwarded-For, Forwarded, single-IP headers) and CIDR ranges
ipnet = "2"
real-ip = "0.1"
hyper = { version = "1", default-features = false, features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "server", "server-graceful", "client-legacy", "http1"] }
mdns-sd = { version = "0.21", default-features = false, features = ["async"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "macros", "signal", "sync"] }
# interfaces with their flags (tunnel, point-to-point, virtual), to find the real LAN and never a VPN such as Tailscale
netdev = { version = "0.46", default-features = false }
getrandom = "0.3"

[dev-dependencies]
# prost is only used by the tests, to decode what the hand-written encoder produces
prost = { version = "0.13", default-features = false, features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
