[package]
name = "pindrel-gateway"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Front-facing process of a Pindrel deployment: load balancer, rate limiter, mDNS announcer/discovery, optional HTTPS with its own CA and device pairing"

[lib]
name = "pindrel_gateway"
path = "src/lib.rs"

[[bin]]
name = "gateway"
path = "src/main.rs"

# the tray icon of the Windows gateway (src/tray.rs): its own small program, built only with `--features tray`
[[bin]]
name = "pindrel-gateway-tray"
path = "src/tray.rs"
required-features = ["tray"]

# Few, small dependencies on purpose: the whole process must stay in a few MB of RAM.
[dependencies]
bytes = "1"
gethostname = "1"
# rate limiting math (GCRA) and clock; the table of clients is ours (src/limiter.rs), with a hard cap
governor = { version = "0.10", default-features = false, features = ["std"] }
http-body-util = "0.1"
if-addrs = "0.15"
# the client address behind a trusted proxy: header parsers (X-Forwarded-For, Forwarded, single-IP headers) and CIDR ranges
ipnet = "2"
real-ip = "0.1"
hyper = { version = "1", default-features = false, features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "server", "server-graceful", "client-legacy", "http1"] }
# optional: TLS with HTTP/2 (feature `tls`); off by default so the plain build stays as small
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
rustls-pki-types = { version = "1", features = ["std"], optional = true }
# optional (feature `selfcert`): the gateway creates its own CA and server certificate, so a LAN needs no domain
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"], optional = true }
time = { version = "0.3", default-features = false, features = ["std"], optional = true }
ring = { version = "0.17", default-features = false, optional = true }
# the QR code of the pairing page: a few KB, no dependencies, drawn as SVG on the server
qrcodegen = { version = "1.8", optional = true }
mdns-sd = { version = "0.21", default-features = false, features = ["async"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "macros", "signal", "sync", "io-util"] }
# interfaces with their flags (tunnel, point-to-point, virtual), to find the real LAN and never a VPN such as Tailscale
netdev = { version = "0.46", default-features = false }
getrandom = "0.3"

# only the tray icon uses it (Windows, feature `tray`); the version already in the tree through the network crates
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", default-features = false, features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[features]
tray = []
tls = ["dep:rustls", "dep:tokio-rustls", "dep:rustls-pki-types", "hyper/http2", "hyper-util/http2", "hyper-util/server-auto"]
selfcert = ["tls", "dep:rcgen", "dep:time", "dep:ring", "dep:qrcodegen"]

[dev-dependencies]
# reads the QR code back, to prove the page carries exactly the pairing code
rqrr = "0.11"
# prost is only used by the tests, to decode what the hand-written encoder produces
prost = { version = "0.13", default-features = false, features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
