basePath: /
definitions:
  dto.ErrorHttp:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  dto.LoginInput:
    properties:
      email:
        type: string
      password:
        type: string
      session_only:
        description: |-
          true: the refresh cookie lasts until the browser closes instead of its full lifetime ("Manter conectado" unchecked).
          Left out, it keeps the long-lived cookie, so clients that do not know the field behave as before.
        type: boolean
    type: object
  dto.LoginRefreshResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
    type: object
  dto.RegisterInput:
    properties:
      email:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
  dto.RegisterResponse:
    properties:
      user:
        $ref: '#/definitions/dto.UserSummary'
    type: object
  dto.UserSummary:
    properties:
      email:
        type: string
      id:
        type: string
      username:
        type: string
    type: object
info:
  contact: {}
  description: Pindrel API, self-hosted notes workspace
  title: Pindrel API
  version: "1.0"
paths:
  /auth/login/:
    post:
      consumes:
      - application/x-protobuf
      description: Authenticate the user and return the access in body and refresh
        token in httpOnly cookie
      parameters:
      - description: Login credentials
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.LoginInput'
      produces:
      - application/x-protobuf
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LoginRefreshResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorHttp'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorHttp'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/dto.ErrorHttp'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/dto.ErrorHttp'
      summary: Open Session
      tags:
      - auth
  /auth/logout/:
    post:
      description: Invalidates the refresh token (and the access token, if sended)
        and clear the cookie
      produces:
      - application/x-protobuf
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorHttp'
      summary: Close the session
      tags:
      - auth
  /auth/me/:
    get:
      description: Returns the user data associated with the session access token
      produces:
      - application/x-protobuf
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserSummary'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorHttp'
      security:
      - BearerAuth: []
      summary: Current user data
      tags:
      - auth
  /auth/refresh/:
    post:
      description: Change one valid refresh token for a new access token
      produces:
      - application/x-protobuf
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LoginRefreshResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorHttp'
      summary: Renews the access token
      tags:
      - auth
  /auth/register/:
    post:
      consumes:
      - application/x-protobuf
      description: Register a new user, if the registration is enabled
      parameters:
      - description: Register data
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterInput'
      produces:
      - application/x-protobuf
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorHttp'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorHttp'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorHttp'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/dto.ErrorHttp'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/dto.ErrorHttp'
      summary: Create a new account
      tags:
      - auth
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
