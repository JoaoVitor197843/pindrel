basePath: /
definitions:
  api.ErrorDetail:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  api.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/api.ErrorDetail'
    type: object
  auth.LoginInput:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  auth.LoginRefreshResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
    type: object
  auth.RegisterInput:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
      username:
        type: string
    required:
    - email
    - password
    - username
    type: object
  auth.RegisterResponse:
    properties:
      user:
        $ref: '#/definitions/auth.UserSummary'
    type: object
  auth.UserSummary:
    properties:
      email:
        type: string
      id:
        type: string
      username:
        type: string
    type: object
  pages.PageData:
    properties:
      data:
        items:
          $ref: '#/definitions/pages.PageMetadata'
        type: array
      next_cursor:
        type: string
      total:
        type: integer
    type: object
  pages.PageMetadata:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      number_of_blocks:
        type: integer
      shared:
        type: boolean
      tags:
        items:
          type: string
        type: array
      title:
        type: string
      trashed_at:
        type: string
      updated_at:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Plany API, self-hosted notes workspace
  title: Plany API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate the user and return the access in body and refresh
        token in httpOnly cookie
      parameters:
      - description: Login credentials
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/auth.LoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginRefreshResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Open Session
      tags:
      - auth
  /auth/logout:
    post:
      description: Invalidates the refresh token (and the access token, if sended)
        and clear the cookie
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Close the session
      tags:
      - auth
  /auth/me:
    get:
      description: Returns the user data associated with the session access token
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.UserSummary'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Current user data
      tags:
      - auth
  /auth/refresh:
    post:
      description: Change one valid refresh token for a new access token
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginRefreshResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Renews the access token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user, if the registration is enabled
      parameters:
      - description: Register data
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Create a new account
      tags:
      - auth
  /pages:
    get:
      description: List proprietary and shared pages, paged by cursor. Don't return
        bin items.
      parameters:
      - default: 20
        description: Number of items per page
        in: query
        name: limit
        type: integer
      - description: Opaque cursor for the next page of results
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pages.PageData'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List user pages
      tags:
      - pages
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
