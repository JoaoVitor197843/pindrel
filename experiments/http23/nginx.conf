# Reference terminator for the HTTP/2 + HTTP/3 experiment (not part of Pindrel): the same gateway behind TLS.
# Cert and key are generated by the experiment script and never committed.
worker_processes 1;
events { worker_connections 1024; }
http {
  access_log off;
  upstream gateway { server 127.0.0.1:8087; keepalive 16; }
  server {
    listen 8443 ssl;
    listen 8443 quic reuseport;
    http2 on;
    http3 on;
    ssl_certificate     /tls/cert.pem;
    ssl_certificate_key /tls/key.pem;
    ssl_protocols TLSv1.3;
    add_header Alt-Svc 'h3=":8443"; ma=86400' always;
    location / {
      proxy_pass http://gateway;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Accept-Encoding $http_accept_encoding;
    }
  }
}
